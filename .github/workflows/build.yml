name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/**/*.csproj') }}
          restore-keys: nuget-

      - name: Restore
        run: dotnet restore src/Todo.CLI.sln

      - name: Build
        run: dotnet build src/Todo.CLI.sln -c Release --no-restore

      - name: Test
        run: dotnet test src/Todo.CLI.sln -c Release --no-build

  publish:
    name: publish-${{ matrix.rid }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native builds on matching runners (macos-latest = Apple Silicon)
          - rid: osx-arm64
            os: macos-latest
            archive: tar.gz
          - rid: win-x64
            os: windows-latest
            archive: zip
          - rid: linux-x64
            os: ubuntu-latest
            archive: tar.gz
          # Cross-compiled on x64: managed-only app, no native toolchain needed
          - rid: linux-arm64
            os: ubuntu-latest
            archive: tar.gz

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/**/*.csproj') }}
          restore-keys: nuget-

      - name: Compute version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="0.3.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Publish self-contained single-file binary
        shell: bash
        run: |
          dotnet publish src/Todo.CLI \
            -c Release \
            -r ${{ matrix.rid }} \
            -o publish \
            --self-contained true \
            -p:Version=${{ steps.ver.outputs.version }}

      - name: Add Linux desktop integration files
        if: startsWith(matrix.rid, 'linux')
        shell: bash
        run: |
          mkdir -p publish/usr/share/applications
          cp assets/todo-cli.desktop publish/usr/share/applications/
          mkdir -p publish/usr/share/icons/hicolor/scalable/apps
          cp assets/logo.png publish/usr/share/icons/hicolor/scalable/apps/todo-cli.png

      - name: Archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: tar -czf "todo-${{ steps.ver.outputs.version }}-${{ matrix.rid }}.tar.gz" -C publish .

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath "todo-${{ steps.ver.outputs.version }}-${{ matrix.rid }}.zip"

      - name: Generate SHA-256 checksum
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          f=$(ls todo-*-${{ matrix.rid }}.*)
          sha256sum "$f" > "$f.sha256"
          cat "$f.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: todo-${{ matrix.rid }}
          path: todo-*-${{ matrix.rid }}.*
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Consolidate checksums
        working-directory: release
        run: cat *.sha256 > SHA256SUMS && rm *.sha256

      - name: Create release with assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*
          generate_release_notes: true
